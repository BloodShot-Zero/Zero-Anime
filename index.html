<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Zero Anime · Dual Gate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', sans-serif;
        }

        body {
            background: #000000;
            color: #eef5ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* landing page */
        .landing {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .landing h1 {
            font-size: 3rem;
            background: linear-gradient(120deg, #3AFAFD, #060EED);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 3rem;
            text-align: center;
        }
        /* two cards side by side always */
        .choice-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            max-width: 800px;
            width: 100%;
        }
        .choice-card {
            background: #0a0f1a;
            border-radius: 40px;
            border: 2px solid #060EED;
            cursor: pointer;
            transition: 0.2s;
            overflow: hidden;
            text-align: center;
            padding: 1rem;
        }
        .choice-card:hover {
            transform: scale(1.02);
            border-color: #3AFAFD;
            box-shadow: 0 0 20px #3AFAFD;
        }
        .choice-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 30px;
            border: 2px solid #3AFAFD;
        }
        .choice-card h2 {
            margin-top: 1rem;
            font-size: 1.5rem;
        }
        @media (max-width: 550px) {
            .choice-container { gap: 1rem; }
            .choice-card h2 { font-size: 1.2rem; }
        }

        /* main app container (hidden initially) */
        .app-container {
            display: none;
        }
        .main-app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .top-bar {
            background: #0a0f1a;
            border-radius: 40px;
            padding: 1rem 1.2rem;
            margin-bottom: 1.5rem;
            border: 1px solid #060EED;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(120deg, #3AFAFD, #060EED);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #bfdcff;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            transition: 0.2s;
        }
        .nav-btn.active, .nav-btn:hover {
            background: #060EED;
            color: white;
            box-shadow: 0 0 8px #3AFAFD;
        }
        .back-landing {
            background: #3AFAFD20;
            border: 1px solid #3AFAFD;
        }
        @media (max-width: 500px) {
            .nav-links { width: 100%; justify-content: center; }
            .nav-btn { flex: 1 0 calc(50% - 0.8rem); text-align: center; }
            .logo h1 { font-size: 1.6rem; text-align: center; width: 100%; }
            .top-bar { flex-direction: column; align-items: stretch; }
        }

        /* search row – now with announcement below */
        .search-row {
            margin-bottom: 1rem;
        }
        .search-wrapper {
            position: relative;
            margin-bottom: 1rem;
        }
        .search-wrapper input {
            width: 100%;
            background: #111522;
            border: 1px solid #060EED;
            padding: 0.8rem 1.2rem;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #0f1422;
            border: 1px solid #060EED;
            border-radius: 24px;
            max-height: 280px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        .dropdown-item {
            padding: 0.7rem 1rem;
            cursor: pointer;
        }
        .dropdown-item:hover { background: #060EED; }

        .announcements {
            background: #060EED;
            border-radius: 32px;
            padding: 0.8rem 1.2rem;
            border: 2px solid #3AFAFD;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .announcements img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3AFAFD;
        }
        .announce-text h4 { color: #3AFAFD; }

        .home-dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
        }
        .featured-section { flex: 2.5; min-width: 260px; }
        .scheduler-section {
            flex: 1.2;
            background: #060EED08;
            border-radius: 32px;
            padding: 1rem;
            border: 1px solid #3AFAFD;
        }
        .section-title {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title span {
            background: #3AFAFD;
            width: 4px;
            height: 24px;
            border-radius: 4px;
        }
        .featured-grid, .all-anime-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        @media (max-width: 550px) {
            .featured-grid, .all-anime-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .anime-card {
            background: #0a0f1f;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #060EED;
        }
        .anime-card:hover {
            transform: translateY(-3px);
            border-color: #3AFAFD;
        }
        .anime-card-img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
        }
        .anime-card-info { padding: 0.6rem; }
        .anime-card-title {
            font-weight: 700;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .schedule-list { display: flex; flex-direction: column; gap: 0.8rem; }
        .schedule-item {
            background: #0a1120;
            border-radius: 16px;
            padding: 0.6rem;
            border-left: 3px solid #3AFAFD;
        }
        .countdown { font-size: 0.7rem; color: #3AFAFD; margin-top: 0.2rem; }
        .load-more { text-align: center; margin: 1.5rem 0; }
        .load-btn {
            background: #060EED;
            border: none;
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            cursor: pointer;
        }
        .detail-page { display: flex; flex-direction: column; gap: 1rem; }
        .player-full { background: #000; border-radius: 24px; overflow: hidden; border: 1px solid #060EED; }
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; background: black; }
        .video-container iframe, .video-container video, .video-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        .episodes-section { background: #0a0f1a; border-radius: 20px; padding: 1rem; }
        .episode-list { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.6rem; }
        .episode-btn { background: #111827; padding: 0.4rem 1rem; border-radius: 40px; font-size: 0.8rem; cursor: pointer; }
        .episode-btn:hover { background: #060EED; }
        .anime-details { background: #060EED08; border-radius: 20px; padding: 1rem; border: 1px solid #3AFAFD; }
        .back-btn { background: #060EED; border: none; padding: 0.4rem 1rem; border-radius: 40px; color: white; margin-bottom: 1rem; cursor: pointer; width: fit-content; }
        .loading { text-align: center; padding: 2rem; color: #3AFAFD; }
        footer { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: #5a7e9e; border-top: 1px solid #060EED; padding-top: 1rem; }
        .no-results { text-align: center; padding: 2rem; background: #0a0f1a; border-radius: 24px; }
        .movie-badge { background: #3AFAFD20; border-radius: 20px; padding: 0.1rem 0.5rem; font-size: 0.7rem; margin-left: 0.3rem; color: #3AFAFD; }
    </style>
</head>
<body>
    <!-- LANDING PAGE -->
    <div id="landingPage" class="landing">
        <h1>⚡ ZERO ANIME</h1>
        <div class="choice-container">
            <div class="choice-card" id="animeChoice">
                <img src="https://i.ibb.co/nNg1X5Hb/images-96.jpg" alt="Anime">
                <h2>📺 ANIME</h2>
            </div>
            <div class="choice-card" id="hentaiChoice">
                <img src="https://i.ibb.co/Ng8mV3sn/IMG-20260514-175823.jpg" alt="Hentai">
                <h2>🔞 HENTAI</h2>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER (hidden initially) -->
    <div id="appContainer" class="app-container"></div>

    <script>
        // --------------------------------------------------------------
        // 1. LANDING PAGE HANDLER
        // --------------------------------------------------------------
        const landing = document.getElementById('landingPage');
        const appContainer = document.getElementById('appContainer');
        let currentMode = null;

        document.getElementById('animeChoice').onclick = () => loadMode('anime');
        document.getElementById('hentaiChoice').onclick = () => loadMode('hentai');

        function loadMode(mode) {
            currentMode = mode;
            landing.style.display = 'none';
            appContainer.style.display = 'block';
            if (mode === 'anime') {
                buildAnimeApp();
            } else {
                buildHentaiApp();
            }
        }

        // --------------------------------------------------------------
        // 2. SHARED UTILITIES
        // --------------------------------------------------------------
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }

        // --------------------------------------------------------------
        // 3. ANIME APP (full featured, with working schedule)
        // --------------------------------------------------------------
        async function buildAnimeApp() {
            const appHtml = `
                <div class="main-app">
                    <div class="top-bar">
                        <div class="logo"><h1>⚡ ZERO‑ANIME</h1></div>
                        <div class="nav-links">
                            <button class="nav-btn active" data-page="home">🏠 Home</button>
                            <button class="nav-btn" data-page="all">📚 All Anime</button>
                            <button class="nav-btn" data-page="anidates">📅 Ani‑Dates</button>
                            <button class="nav-btn" data-page="surprise">🎲 Surprise Me</button>
                            <button class="nav-btn back-landing" id="backToLanding">🏠 Exit to Gate</button>
                        </div>
                    </div>
                    <div class="search-row">
                        <div class="search-wrapper">
                            <input type="text" id="searchInput" placeholder="🔍 Search anime (English)..." autocomplete="off">
                            <div id="searchDropdown" class="dropdown"></div>
                        </div>
                        <div class="announcements">
                            <img src="https://i.ibb.co/nNg1X5Hb/images-96.jpg" alt="Zero-Anime">
                            <div class="announce-text"><h4>📢 Announcements</h4><p>New episodes every Friday! Enjoy Zero‑Anime.</p></div>
                        </div>
                    </div>
                    <div id="homePage" class="page active-page">
                        <div class="home-dashboard">
                            <div class="featured-section"><div class="section-title"><span></span> 🔥 Featured Anime</div><div id="featuredGrid" class="featured-grid"><div class="loading">Loading...</div></div></div>
                            <div class="scheduler-section"><div class="section-title"><span></span> 🗓️ Airing Schedule (GMT+2)</div><div id="scheduleListHome" class="schedule-list"><div class="loading">Fetching schedule...</div></div></div>
                        </div>
                    </div>
                    <div id="allPage" class="page"><div class="section-title"><span></span> 📀 All Anime (1000+)</div><div id="allAnimeGrid" class="all-anime-grid"><div class="loading">Loading library...</div></div><div class="load-more" id="loadMoreContainerAll" style="display: none;"><button class="load-btn" id="loadMoreBtnAll">+ Load more</button></div></div>
                    <div id="anidatesPage" class="page"><div class="section-title"><span></span> 📅 Complete Airing Schedule (GMT+2)</div><div id="fullScheduleList" class="schedule-list"><div class="loading">Loading schedule...</div></div></div>
                    <div id="detailPage" class="page"><button class="back-btn" id="backToPrevPage">← Back</button><div id="detailContent"><div class="loading">Loading...</div></div></div>
                    <footer>Zero Anime - By BloodShot</footer>
                </div>
            `;
            appContainer.innerHTML = appHtml;
            initAnimeApp();
        }

        async function initAnimeApp() {
            const JIKAN_API = "https://api.jikan.moe/v4";
            const CORS_PROXY = "https://corsproxy.io/?";
            const CONSUMET_API = "https://api.consumet.org/anime/gogoanime";

            function getEnglishTitle(anime) { return anime.title_english || anime.title || "Unknown"; }
            async function fetchVideoUrl(animeTitle, episodeNumber) {
                try {
                    const searchUrl = `${CORS_PROXY}${CONSUMET_API}/search?keyw=${encodeURIComponent(animeTitle)}`;
                    const searchRes = await fetch(searchUrl);
                    if (searchRes.ok) {
                        const searchData = await searchRes.json();
                        if (searchData.results && searchData.results.length) {
                            const gogoId = searchData.results[0].id;
                            const episodeUrl = `${CORS_PROXY}${CONSUMET_API}/watch/${gogoId}?ep=${episodeNumber}`;
                            const epRes = await fetch(episodeUrl);
                            if (epRes.ok) {
                                const epData = await epRes.json();
                                if (epData.sources && epData.sources.length) {
                                    let kwik = epData.sources.find(s => s.url.includes('kwik'));
                                    return kwik ? kwik.url : epData.sources[0].url;
                                }
                            }
                        }
                    }
                } catch(e) { console.warn(e); }
                return null;
            }
            async function fetchTopAnime(page, limit) {
                try { const res = await fetch(`${JIKAN_API}/top/anime?page=${page}&limit=${limit}&filter=bypopularity`); return (await res.json()).data || []; } catch(e) { return []; }
            }
            async function fetchAnimeById(id) {
                try { const res = await fetch(`${JIKAN_API}/anime/${id}/full`); return (await res.json()).data; } catch(e) { return null; }
            }
            async function fetchEpisodes(animeId, page) {
                try { const res = await fetch(`${JIKAN_API}/anime/${animeId}/episodes?page=${page}`); return (await res.json()).data || []; } catch(e) { return []; }
            }
            async function fetchSchedule() {
                try {
                    const now = new Date();
                    const year = now.getFullYear();
                    const month = now.getMonth()+1;
                    let season = 'spring';
                    if (month>=3 && month<=5) season='spring';
                    else if (month>=6 && month<=8) season='summer';
                    else if (month>=9 && month<=11) season='fall';
                    else season='winter';
                    const res = await fetch(`${JIKAN_API}/seasons/${year}/${season}?limit=40`);
                    const json = await res.json();
                    return json.data.filter(a => a.broadcast && a.broadcast.day);
                } catch(e) { return []; }
            }
            function getCountdown(dayOfWeek, timeJST) {
                if (!dayOfWeek || !timeJST) return null;
                const daysMap = { "Sunday":0, "Monday":1, "Tuesday":2, "Wednesday":3, "Thursday":4, "Friday":5, "Saturday":6 };
                let targetDay = daysMap[dayOfWeek];
                if (targetDay === undefined) return null;
                let [hourJST, minuteJST] = timeJST.split(':').map(Number);
                if (isNaN(hourJST)) return null;
                let hourGMT2 = hourJST - 7;
                let now = new Date();
                let currentDay = now.getDay();
                let targetDate = new Date(now);
                targetDate.setHours(hourGMT2, minuteJST, 0, 0);
                let daysUntil = targetDay - currentDay;
                if (daysUntil < 0 || (daysUntil === 0 && targetDate <= now)) daysUntil += 7;
                targetDate.setDate(now.getDate() + daysUntil);
                let diffMs = targetDate - now;
                if (diffMs < 0) diffMs = 0;
                let hours = Math.floor(diffMs / (1000 * 60 * 60));
                let minutes = Math.floor((diffMs % (3600000)) / 60000);
                return { hours, minutes };
            }
            async function renderScheduleTo(containerId) {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = '<div class="loading">Loading schedule...</div>';
                let airing = await fetchSchedule();
                if (!airing.length) { container.innerHTML = '<div class="loading">No schedule available. Try again later.</div>'; return; }
                let html = '';
                for (let anime of airing) {
                    const title = getEnglishTitle(anime);
                    const day = anime.broadcast.day;
                    const timeJST = anime.broadcast.time || '';
                    const countdown = getCountdown(day, timeJST);
                    let countdownText = countdown ? `<div class="countdown">⏳ Releases in ${countdown.hours}h ${countdown.minutes}m</div>` : `<div class="countdown">⏰ Time unknown</div>`;
                    html += `<div class="schedule-item"><div class="schedule-title">${escapeHtml(title)}</div><div>📅 ${day} at ${timeJST} JST</div>${countdownText}</div>`;
                }
                container.innerHTML = html;
            }
            let allAnimeList = [], allPageCurrent = 1, isLoadingAll = false, currentFilter = "", currentPageType = "home";
            const homePage = document.getElementById('homePage'), allPage = document.getElementById('allPage'), anidatesPage = document.getElementById('anidatesPage'), detailPage = document.getElementById('detailPage');
            const navBtns = document.querySelectorAll('.nav-btn:not(.back-landing)'), featuredGrid = document.getElementById('featuredGrid'), allAnimeGrid = document.getElementById('allAnimeGrid'), loadMoreContainerAll = document.getElementById('loadMoreContainerAll'), loadMoreBtnAll = document.getElementById('loadMoreBtnAll'), detailContent = document.getElementById('detailContent'), backBtn = document.getElementById('backToPrevPage'), searchInput = document.getElementById('searchInput'), dropdown = document.getElementById('searchDropdown');
            function attachCardListeners(container) { container.querySelectorAll('.anime-card').forEach(card => { const id = card.dataset.id; if (id) card.addEventListener('click', () => showDetail(id)); }); }
            function renderAllAnimeGrid() {
                let filtered = allAnimeList.filter(a => getEnglishTitle(a).toLowerCase().includes(currentFilter.toLowerCase()));
                if (filtered.length === 0) {
                    let suggestions = allAnimeList.slice(0, 6).map(a => getEnglishTitle(a));
                    let html = `<div class="no-results"><h3>😿 No results for "${escapeHtml(currentFilter)}"</h3><p>Try these:</p><div style="display:flex; flex-wrap:wrap; gap:0.5rem; justify-content:center;">`;
                    suggestions.forEach(title => { html += `<div class="suggestion-card" style="background:#060EED20; padding:0.3rem 0.8rem; border-radius:40px; cursor:pointer;" data-suggestion="${escapeHtml(title)}">${escapeHtml(title)}</div>`; });
                    html += `</div></div>`;
                    allAnimeGrid.innerHTML = html;
                    document.querySelectorAll('.suggestion-card').forEach(card => { card.addEventListener('click', () => { const title = card.dataset.suggestion; const anime = allAnimeList.find(a => getEnglishTitle(a) === title); if (anime) showDetail(anime.mal_id); }); });
                    return;
                }
                let html = '';
                filtered.forEach(anime => {
                    const englishTitle = getEnglishTitle(anime);
                    const isMovie = anime.type === "Movie";
                    const badgeHtml = isMovie ? `<span class="movie-badge">🎬 Movie</span>` : '';
                    html += `<div class="anime-card" data-id="${anime.mal_id}"><img class="anime-card-img" src="${anime.images.jpg.image_url}" loading="lazy" onerror="this.src='https://placehold.co/400x560/060EED/3AFAFD?text=No+Image'"><div class="anime-card-info"><div class="anime-card-title">${escapeHtml(englishTitle)} ${badgeHtml}</div><div class="anime-card-desc">⭐ ${anime.score || '?'}</div></div></div>`;
                });
                allAnimeGrid.innerHTML = html;
                attachCardListeners(allAnimeGrid);
            }
            async function loadAllAnime(reset) {
                if (reset) { allAnimeList = []; allPageCurrent = 1; allAnimeGrid.innerHTML = '<div class="loading">Loading library...</div>'; }
                if (isLoadingAll) return;
                isLoadingAll = true;
                const newAnime = await fetchTopAnime(allPageCurrent, 25);
                if (newAnime.length) { allAnimeList.push(...newAnime); renderAllAnimeGrid(); allPageCurrent++; loadMoreContainerAll.style.display = (newAnime.length === 25 && allPageCurrent <= 40) ? 'block' : 'none'; } else loadMoreContainerAll.style.display = 'none';
                isLoadingAll = false;
            }
            async function loadHome() {
                featuredGrid.innerHTML = '<div class="loading">Loading featured...</div>';
                const top = await fetchTopAnime(1, 10);
                const featured = top.slice(0, 4);
                if (featured.length) {
                    let html = '';
                    featured.forEach(anime => { const englishTitle = getEnglishTitle(anime); html += `<div class="anime-card" data-id="${anime.mal_id}"><img class="anime-card-img" src="${anime.images.jpg.image_url}" loading="lazy" onerror="this.src='https://placehold.co/400x560/060EED/3AFAFD?text=No+Image'"><div class="anime-card-info"><div class="anime-card-title">${escapeHtml(englishTitle)}</div><div class="anime-card-desc">⭐ ${anime.score || '?'}</div></div></div>`; });
                    featuredGrid.innerHTML = html;
                    attachCardListeners(featuredGrid);
                } else featuredGrid.innerHTML = '<div class="loading">Failed to load featured.</div>';
                await renderScheduleTo('scheduleListHome');
            }
            async function showDetail(animeId) {
                currentPageType = 'detail';
                setActivePage('detail');
                detailContent.innerHTML = '<div class="loading">Loading anime details...</div>';
                let anime = await fetchAnimeById(animeId);
                if (!anime) { detailContent.innerHTML = '<div class="loading">Error loading details.</div>'; return; }
                const isMovie = (anime.type === "Movie");
                let episodes = [];
                if (!isMovie) { episodes = await fetchEpisodes(anime.mal_id, 1); let eps2 = await fetchEpisodes(anime.mal_id, 2); episodes = [...episodes, ...eps2]; }
                const englishTitle = getEnglishTitle(anime);
                let episodeHtml = isMovie ? `<div class="episode-btn" data-ep="1" data-title="${escapeHtml(englishTitle)}">🎬 Watch Movie</div>` : episodes.map(ep => `<div class="episode-btn" data-ep="${ep.episode}" data-title="${escapeHtml(englishTitle)}">Ep ${ep.episode}: ${escapeHtml(ep.title || '')}</div>`).join('');
                detailContent.innerHTML = `<div class="detail-page"><div class="player-full"><div class="video-container"><iframe id="videoPlayer" src="about:blank" allowfullscreen></iframe></div></div><div class="episodes-section"><div class="section-title"><span></span> ${isMovie ? '🎬 Movie' : '📺 Episodes'}</div><div class="episode-list" id="episodeList">${episodeHtml}</div></div><div class="anime-details"><img src="${anime.images.jpg.large_image_url || anime.images.jpg.image_url}" style="width:80px; border-radius:16px; float:right; margin-left:1rem;"><h2>${escapeHtml(englishTitle)} ${isMovie ? '<span class="movie-badge">Movie</span>' : ''}</h2><p><strong>⭐ Score:</strong> ${anime.score || 'N/A'} | <strong>Year:</strong> ${anime.year || '?'}</p><p>${escapeHtml(anime.synopsis?.substring(0, 500) || 'No synopsis')}</p></div></div>`;
                const iframe = document.getElementById('videoPlayer');
                const btns = document.querySelectorAll('.episode-btn');
                btns.forEach(btn => { btn.addEventListener('click', async () => { const epNum = btn.dataset.ep === "1" ? 1 : parseInt(btn.dataset.ep); const title = btn.dataset.title; btn.innerText = isMovie ? "⏳ Loading Movie..." : `⏳ Loading Ep ${epNum}...`; const url = await fetchVideoUrl(title, epNum); btn.innerText = isMovie ? "🎬 Watch Movie" : `Ep ${epNum}`; iframe.src = url || `https://hianime.be/search?keyword=${encodeURIComponent(title)}%20${isMovie ? 'movie' : 'episode'}%20${epNum}`; }); });
                if (btns.length) btns[0].click();
            }
            function surpriseMe() { if (allAnimeList.length === 0) { alert("Library still loading."); return; } const randomIndex = Math.floor(Math.random() * allAnimeList.length); showDetail(allAnimeList[randomIndex].mal_id); }
            function setActivePage(pageId) {
                homePage.classList.remove('active-page'); allPage.classList.remove('active-page'); anidatesPage.classList.remove('active-page'); detailPage.classList.remove('active-page');
                if (pageId === 'home') homePage.classList.add('active-page');
                else if (pageId === 'all') allPage.classList.add('active-page');
                else if (pageId === 'anidates') anidatesPage.classList.add('active-page');
                else if (pageId === 'detail') detailPage.classList.add('active-page');
                navBtns.forEach(btn => { const pg = btn.dataset.page; btn.classList.toggle('active', pg === pageId); });
            }
            navBtns.forEach(btn => { btn.addEventListener('click', () => { const page = btn.dataset.page; if (page === 'home') { setActivePage('home'); loadHome(); } else if (page === 'all') { setActivePage('all'); if (allAnimeList.length === 0) loadAllAnime(true); else renderAllAnimeGrid(); } else if (page === 'anidates') { setActivePage('anidates'); renderScheduleTo('fullScheduleList'); } else if (page === 'surprise') { surpriseMe(); } }); });
            backBtn.addEventListener('click', () => { if (currentPageType === 'detail') { const activeNav = document.querySelector('.nav-btn.active')?.dataset.page; setActivePage(activeNav === 'home' ? 'home' : (activeNav === 'all' ? 'all' : 'home')); } });
            loadMoreBtnAll.addEventListener('click', () => loadAllAnime(false));
            searchInput.addEventListener('input', async () => { const query = searchInput.value.trim(); if (allPage.classList.contains('active-page')) { currentFilter = query; renderAllAnimeGrid(); } if (query.length < 2) { dropdown.style.display = 'none'; return; } try { const res = await fetch(`${JIKAN_API}/anime?q=${encodeURIComponent(query)}&limit=8`); const data = await res.json(); if (data.data && data.data.length) { dropdown.innerHTML = ''; data.data.forEach(anime => { const title = getEnglishTitle(anime); const div = document.createElement('div'); div.className = 'dropdown-item'; div.textContent = title; div.onclick = () => { searchInput.value = title; dropdown.style.display = 'none'; if (allPage.classList.contains('active-page')) { currentFilter = title; renderAllAnimeGrid(); } else { showDetail(anime.mal_id); } }; dropdown.appendChild(div); }); dropdown.style.display = 'block'; } else dropdown.style.display = 'none'; } catch(e) { dropdown.style.display = 'none'; } });
            document.addEventListener('click', (e) => { if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) dropdown.style.display = 'none'; });
            loadHome(); loadAllAnime(true);
            document.getElementById('backToLanding').onclick = () => { landing.style.display = 'flex'; appContainer.style.display = 'none'; };
        }

        // --------------------------------------------------------------
        // 4. HENTAI APP – using open source API (Nekos.life + Waifu.pics)
        // --------------------------------------------------------------
        async function buildHentaiApp() {
            const appHtml = `
                <div class="main-app">
                    <div class="top-bar">
                        <div class="logo"><h1>🔞 ZERO HENTAI</h1></div>
                        <div class="nav-links">
                            <button class="nav-btn active" data-page="home">🏠 Home</button>
                            <button class="nav-btn" data-page="all">📚 All Hentai</button>
                            <button class="nav-btn" data-page="surprise">🎲 Surprise Me</button>
                            <button class="nav-btn back-landing" id="backToLanding">🏠 Exit to Gate</button>
                        </div>
                    </div>
                    <div class="search-row">
                        <div class="search-wrapper">
                            <input type="text" id="searchInput" placeholder="🔍 Search hentai tags..." autocomplete="off">
                            <div id="searchDropdown" class="dropdown"></div>
                        </div>
                        <div class="announcements">
                            <img src="https://i.ibb.co/Ng8mV3sn/IMG-20260514-175823.jpg" alt="Hentai">
                            <div class="announce-text"><h4>📢 18+ Only</h4><p>Content from open source APIs (Nekos.life, Waifu.pics). Use responsibly.</p></div>
                        </div>
                    </div>
                    <div id="homePage" class="page active-page">
                        <div class="home-dashboard">
                            <div class="featured-section"><div class="section-title"><span></span> 🔥 Featured Hentai</div><div id="featuredGrid" class="featured-grid"><div class="loading">Loading featured...</div></div></div>
                            <div class="scheduler-section"><div class="section-title"><span></span> 🗓️ New Releases</div><div id="scheduleListHome" class="schedule-list"><div class="loading">Fetching updates...</div></div></div>
                        </div>
                    </div>
                    <div id="allPage" class="page"><div class="section-title"><span></span> 📀 All Hentai (from API)</div><div id="allAnimeGrid" class="all-anime-grid"><div class="loading">Loading library...</div></div><div class="load-more" id="loadMoreContainerAll" style="display: none;"><button class="load-btn" id="loadMoreBtnAll">+ Load more</button></div></div>
                    <div id="detailPage" class="page"><button class="back-btn" id="backToPrevPage">← Back</button><div id="detailContent"><div class="loading">Loading...</div></div></div>
                    <footer>Zero Anime - By BloodShot | Hentai content from public APIs (18+)</footer>
                </div>
            `;
            appContainer.innerHTML = appHtml;
            initHentaiApp();
        }

        async function initHentaiApp() {
            // Using two free open source APIs:
            // - Nekos.life (https://nekos.life/api/v2/img/hentai) returns random hentai image
            // - Waifu.pics (https://api.waifu.pics/nsfw/waifu) also returns random hentai image
            // We'll generate a library of items by fetching random images and assigning fake titles.
            const API_NEKOS = "https://nekos.life/api/v2/img/hentai";
            const API_WAIFU = "https://api.waifu.pics/nsfw/waifu";

            async function fetchRandomImage() {
                try {
                    const res = await fetch(API_NEKOS);
                    const data = await res.json();
                    return data.url;
                } catch(e) {
                    const res = await fetch(API_WAIFU);
                    const data = await res.json();
                    return data.url;
                }
            }

            async function generateItems(count) {
                let items = [];
                for (let i = 0; i < count; i++) {
                    const imgUrl = await fetchRandomImage();
                    items.push({
                        id: Date.now() + i,
                        title: `Hentai #${i+1}`,
                        image: imgUrl,
                        video: imgUrl, // treat as image for now
                        type: "image"
                    });
                }
                return items;
            }

            let allItems = [];
            let currentPage = 1;
            let isLoading = false;
            let currentFilter = "";
            let currentDetailItem = null;
            let allItemsLoaded = false;

            const homePage = document.getElementById('homePage');
            const allPage = document.getElementById('allPage');
            const detailPage = document.getElementById('detailPage');
            const navBtns = document.querySelectorAll('.nav-btn:not(.back-landing)');
            const featuredGrid = document.getElementById('featuredGrid');
            const scheduleHome = document.getElementById('scheduleListHome');
            const allGrid = document.getElementById('allAnimeGrid');
            const loadMoreContainer = document.getElementById('loadMoreContainerAll');
            const loadMoreBtn = document.getElementById('loadMoreBtnAll');
            const detailContent = document.getElementById('detailContent');
            const backBtn = document.getElementById('backToPrevPage');
            const searchInput = document.getElementById('searchInput');
            const dropdown = document.getElementById('searchDropdown');
            let currentPageType = "home";

            function attachCardListeners(container) {
                container.querySelectorAll('.anime-card').forEach(card => {
                    const id = card.dataset.id;
                    if (id) card.addEventListener('click', () => showDetail(id));
                });
            }

            function renderAllGrid() {
                let filtered = allItems.filter(i => i.title.toLowerCase().includes(currentFilter.toLowerCase()));
                if (filtered.length === 0) {
                    allGrid.innerHTML = `<div class="no-results">😿 No results for "${escapeHtml(currentFilter)}"</div>`;
                    return;
                }
                let html = '';
                filtered.forEach(item => {
                    html += `<div class="anime-card" data-id="${item.id}">
                                <img class="anime-card-img" src="${item.image}" loading="lazy" onerror="this.src='https://placehold.co/400x560/060EED/3AFAFD?text=No+Image'">
                                <div class="anime-card-info">
                                    <div class="anime-card-title">${escapeHtml(item.title)}</div>
                                    <div class="anime-card-desc">⭐ Random</div>
                                </div>
                            </div>`;
                });
                allGrid.innerHTML = html;
                attachCardListeners(allGrid);
            }

            async function loadMoreItems(reset = true) {
                if (reset) { allItems = []; currentPage = 1; allGrid.innerHTML = '<div class="loading">Loading library...</div>'; allItemsLoaded = false; }
                if (isLoading) return;
                isLoading = true;
                const newItems = await generateItems(20);
                if (newItems.length) {
                    allItems.push(...newItems);
                    renderAllGrid();
                    currentPage++;
                    loadMoreContainer.style.display = (newItems.length === 20 && currentPage <= 3) ? 'block' : 'none';
                } else loadMoreContainer.style.display = 'none';
                isLoading = false;
                allItemsLoaded = true;
            }

            async function loadHome() {
                featuredGrid.innerHTML = '<div class="loading">Loading featured...</div>';
                const items = await generateItems(4);
                let html = '';
                items.forEach(item => {
                    html += `<div class="anime-card" data-id="${item.id}">
                                <img class="anime-card-img" src="${item.image}" loading="lazy">
                                <div class="anime-card-info"><div class="anime-card-title">${escapeHtml(item.title)}</div></div>
                            </div>`;
                });
                featuredGrid.innerHTML = html;
                attachCardListeners(featuredGrid);
                scheduleHome.innerHTML = `<div class="schedule-item"><div class="schedule-title">New content every day</div><div class="countdown">Powered by open source APIs (Nekos.life, Waifu.pics)</div></div>`;
            }

            async function showDetail(itemId) {
                currentPageType = 'detail';
                setActivePage('detail');
                const item = allItems.find(i => i.id == itemId);
                if (!item) { detailContent.innerHTML = '<div class="loading">Error loading.</div>'; return; }
                detailContent.innerHTML = `
                    <div class="detail-page">
                        <div class="player-full">
                            <div class="video-container">
                                <img src="${item.image}" alt="${escapeHtml(item.title)}" style="width:100%; height:100%; object-fit:contain;">
                            </div>
                        </div>
                        <div class="anime-details">
                            <h2>${escapeHtml(item.title)}</h2>
                            <p>Source: ${escapeHtml(API_NEKOS)}</p>
                            <p>Images are randomly fetched from public APIs. No search yet – click Surprise Me for random.</p>
                        </div>
                    </div>
                `;
            }

            function surpriseMe() {
                if (!allItemsLoaded || allItems.length === 0) { alert("Loading library first..."); return; }
                const random = Math.floor(Math.random() * allItems.length);
                showDetail(allItems[random].id);
            }

            function setActivePage(pageId) {
                homePage.classList.remove('active-page');
                allPage.classList.remove('active-page');
                detailPage.classList.remove('active-page');
                if (pageId === 'home') homePage.classList.add('active-page');
                else if (pageId === 'all') allPage.classList.add('active-page');
                else if (pageId === 'detail') detailPage.classList.add('active-page');
                navBtns.forEach(btn => { const pg = btn.dataset.page; btn.classList.toggle('active', pg === pageId); });
            }

            navBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const page = btn.dataset.page;
                    if (page === 'home') { setActivePage('home'); loadHome(); }
                    else if (page === 'all') { setActivePage('all'); if (allItems.length === 0) loadMoreItems(true); else renderAllGrid(); }
                    else if (page === 'surprise') { surpriseMe(); }
                });
            });
            backBtn.addEventListener('click', () => { if (currentPageType === 'detail') { const activeNav = document.querySelector('.nav-btn.active')?.dataset.page; setActivePage(activeNav === 'home' ? 'home' : 'all'); } });
            loadMoreBtn.addEventListener('click', () => loadMoreItems(false));
            searchInput.addEventListener('input', (e) => { if (allPage.classList.contains('active-page')) { currentFilter = e.target.value; renderAllGrid(); } });
            // no complex dropdown for hentai – just filter
            loadHome();
            loadMoreItems(true);
            document.getElementById('backToLanding').onclick = () => { landing.style.display = 'flex'; appContainer.style.display = 'none'; };
        }
    </script>
